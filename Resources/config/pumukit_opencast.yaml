services:
  _defaults:
    autowire:      true
    autoconfigure: true
    public:        true
    bind:
      $player: '%pumukit_opencast.player%'
      $scheduler: '%pumukit_opencast.scheduler%'
      $opencastShowImporterTab: '%pumukit_opencast.show_importer_tab%'
      $opencastBatchImportInverted: '%pumukit_opencast.batchimport_inverted%'
      $deleteArchiveMediaPackage: '%pumukit_opencast.delete_archive_mediapackage%'
      $manageOpencastUsers: '%pumukit_opencast.manage_opencast_users%'
      $syncSeriesWithOpencast: '%pumukit_opencast.sync_series_with_opencast%'
      $errorIfFileNotExist: '%pumukit_opencast.error_if_file_not_exist%'
      $urlMapping: '%pumukit_opencast.url_mapping%'
      $sbsConfiguration: '%pumukit_opencast.sbs%'
      $defaultTagImported: '%pumukit_opencast.default_tag_imported%'
      $secondsToSleep: '%pumukit_opencast.seconds_to_sleep_on_commands%'
      $notificationConfig: '%pumukit_opencast.notifications%'
      $otherLocales: '%pumukit.locales%'
      $customLanguages: '%pumukit.customlanguages%'
      $locale: '%kernel.default_locale%'

  Pumukit\OpencastBundle\Controller\:
    resource: '../../Controller/'
    tags: ['controller.service_arguments']

  Pumukit\OpencastBundle\Command\:
    resource: '../../Command/'

  Pumukit\OpencastBundle\Api\:
    resource: '../../Api/'
    exclude: '../../Api/{SearchResult,OpencastUser}.php'

  Pumukit\OpencastBundle\Api\OpencastApiResolver:
    arguments:
      $apis: !tagged_iterator pumukit_opencast.api

  Pumukit\OpencastBundle\Client\OpencastConnection:
    arguments:
      $host: '%pumukit_opencast.host%'
      $adminHost: '%pumukit_opencast.admin_host%'
      $username: '%pumukit_opencast.username%'
      $password: '%pumukit_opencast.password%'
      $insecure: '%pumukit_opencast.insecure%'

  Pumukit\OpencastBundle\Client\OpencastHttpClient:
    arguments:
      $logger: '@monolog.logger.opencast'

  Pumukit\OpencastBundle\Services\ClientService:
    arguments:
      $logger: '@monolog.logger.opencast'

  pumukit_opencast.client:
    alias: Pumukit\OpencastBundle\Services\ClientService
    public: true

  Pumukit\OpencastBundle\Services\ClientServiceFactory: ~
  Pumukit\OpencastBundle\Services\OpencastService: ~
  Pumukit\OpencastBundle\Services\SeriesImportService: ~
  Pumukit\OpencastBundle\Services\SeriesSyncService: ~
  Pumukit\OpencastBundle\Services\OpencastImportService: ~

  Pumukit\OpencastBundle\MessageHandler\ImportNotificationHandler: ~

  Pumukit\OpencastBundle\EventListener\ImportNotificationListener:
    tags:
      - { name: kernel.event_listener, event: Pumukit\OpencastBundle\Event\ImportEvent, method: onImport }

  Pumukit\OpencastBundle\EventListener\RemoveListener:
    tags:
      - { name: kernel.event_listener, event: multimediaobject.delete, method: onMultimediaObjectDelete }

  Pumukit\OpencastBundle\EventListener\UserListener:
    tags:
      - { name: kernel.event_listener, event: user.create, method: onUserEvent }
      - { name: kernel.event_listener, event: user.update, method: onUserEvent }
      - { name: kernel.event_listener, event: user.delete, method: onUserEvent }

  Pumukit\OpencastBundle\EventListener\SeriesListener:
    tags:
      - { name: kernel.event_listener, event: series.create, method: onSeriesSync }
      - { name: kernel.event_listener, event: series.update, method: onSeriesSync }
      - { name: kernel.event_listener, event: series.delete, method: onSeriesSync }
